name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Pushes to main skip CI when a PR already passed on the same tree (see
  # already-passed below), so main no longer gets a live acceptance run per
  # merge. This nightly run of everything is what catches drift in the live
  # Cloud API between merges. 07:17 UTC is the small hours in New York.
  schedule:
    - cron: "17 7 * * *"
  # Lets CI be started by hand, e.g. after Actions is turned on for a fork.
  workflow_dispatch:

permissions:
  contents: read

# Go build cache: only the go-cache job saves it (on pushes to main), after
# compiling everything the other jobs compile; every other job only restores
# it. When each job saved through setup-go's `cache: true`, the first job to
# finish -- Format Check, which compiles nothing -- won the shared key with an
# empty cache, and since that key only changed with go.sum, every job compiled
# from scratch on every run.

jobs:
  # Merges are rebase merges of a PR that was rebased on main first, so the
  # commit that lands on main usually has exactly the tree the PR run tested.
  # Running the whole suite again on that tree repeats a pass, holds the shared
  # live org for minutes and queues other PRs' acceptance runs behind it. When
  # a PR run from this repository already passed every job, including
  # acceptance, on the same tree, the rest of this run is skipped.
  already-passed:
    name: Already Passed On PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Look for a passing PR run on this tree
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
          TREE: ${{ github.event.head_commit.tree_id }}
        run: |
          if [ -z "$TREE" ]; then
            echo "No head commit tree; running everything."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only markers from runs on this repository's own branches count: a
          # fork PR runs the workflow file from its own head, so it could
          # upload a marker for a tree it never tested (and fork PRs skip
          # acceptance anyway). A failed lookup runs everything.
          n=$(gh api "repos/$REPO/actions/artifacts?name=ci-passed-tree-$TREE&per_page=100" \
                --jq "[.artifacts[] | select(.expired == false
                        and .workflow_run.repository_id == $REPO_ID
                        and .workflow_run.head_repository_id == $REPO_ID)] | length") || n=0
          if [ "${n:-0}" -gt 0 ]; then
            echo "Tree $TREE already passed CI on a PR; skipping the rest of this run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No passing PR run on tree $TREE; running everything."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: already-passed
    # On pull requests already-passed is skipped and its output is empty, so
    # this runs; !cancelled() lets it run despite that skipped dependency.
    if: ${{ !cancelled() && needs.already-passed.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: false

      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-build-${{ runner.os }}-

      - name: Build
        run: go build -v ./...

  test:
    name: Unit Tests
    needs: already-passed
    if: ${{ !cancelled() && needs.already-passed.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: false

      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-build-${{ runner.os }}-

      - name: Run tests
        run: go test ./... -count=1 -parallel=4 -timeout 30s

  vet:
    name: Vet
    needs: already-passed
    if: ${{ !cancelled() && needs.already-passed.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: false

      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-build-${{ runner.os }}-

      - name: Run go vet
        run: go vet ./...

  fmt:
    name: Format Check
    needs: already-passed
    if: ${{ !cancelled() && needs.already-passed.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Check formatting
        run: |
          files=$(gofmt -l $(find . -name '*.go' | grep -v vendor))
          if [ -n "$files" ]; then
            echo "The following files are not formatted:"
            echo "$files"
            exit 1
          fi

  lint:
    name: Lint
    needs: already-passed
    if: ${{ !cancelled() && needs.already-passed.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: false

      # The action keeps its own analysis cache.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3

  # docs/ is generated from the provider schema plus examples/. If a schema
  # description or an example changes without regenerating, the Registry pages
  # silently go stale -- so the drift is a build failure, not a review comment.
  docs:
    name: Docs Up To Date
    needs: already-passed
    if: ${{ !cancelled() && needs.already-passed.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: false

      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-build-${{ runner.os }}-

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Regenerate docs
        run: make generate

      - name: Fail if docs are stale
        run: |
          # `git diff` compares the index to the working tree and never sees
          # untracked files, so a brand-new docs page -- exactly what adding a
          # resource produces -- slipped through and this required check went
          # green with the new resource undocumented. `git status --porcelain`
          # reports untracked files too.
          CHANGES=$(git status --porcelain -- docs/)
          if [ -n "$CHANGES" ]; then
            echo "ERROR: docs/ is out of date. Run 'make generate' and commit the result."
            echo
            echo "$CHANGES"
            echo
            git diff -- docs/
            exit 1
          fi
          echo "docs/ is up to date"

  # Plan-check tests run a real terraform plan/apply against an in-memory fake
  # of the Cloud API, so they need no token and create nothing. That makes them
  # cheap enough to run across the Terraform versions the README claims support
  # for -- the compatibility surface acceptance tests never exercise.
  plan:
    name: Plan Tests (TF ${{ matrix.terraform }})
    needs: already-passed
    if: ${{ !cancelled() && needs.already-passed.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        terraform: ["1.0.*", "1.8.*", "latest"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: false

      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-build-${{ runner.os }}-

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - name: Run plan-check tests
        env:
          TF_ACC: "1"
        run: go test ./internal/provider/ -count=1 -run 'Plan$' -timeout 15m

  acceptance:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [already-passed, build, test, vet]
    # Runs only once build, unit tests and vet passed (which also means the run
    # was not skipped), and not for fork PRs, which get no secrets.
    if: >-
      ${{ !cancelled()
      && needs.build.result == 'success'
      && needs.test.result == 'success'
      && needs.vet.result == 'success'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository) }}
    # Acceptance tests create real resources in one shared Cloud account, so
    # overlapping runs collide on names and quota. Queue them instead.
    # cancel-in-progress is deliberately false: cancelling mid-apply would
    # orphan real infrastructure rather than destroying it. queue: max lets up
    # to 100 jobs wait their turn; the default keeps one waiting job, so each
    # new PR or main push cancelled whichever acceptance job was waiting.
    # The group was renamed along with queue: max: in the old group, jobs from
    # runs still on the single-slot setting cancelled a *running* queue: max
    # job. Never share this group with jobs that do not set queue: max.
    concurrency:
      group: acceptance-queue-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    env:
      TF_ACC: "1"
      LARAVEL_CLOUD_API_TOKEN: ${{ secrets.LARAVEL_CLOUD_API_TOKEN }}
      LARAVEL_CLOUD_BASE_URL: ${{ secrets.LARAVEL_CLOUD_BASE_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: false

      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-build-${{ runner.os }}-

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      # Only the live TestAcc tests: with TF_ACC=1, ./... would also rerun the
      # plan tests and unit tests, which their own jobs already cover, while
      # this job holds the shared org.
      - name: Run acceptance tests
        run: go test ./... -v -count=1 -parallel=4 -run '^TestAcc' -timeout 60m

  # Marks this PR run's tree as passed, for already-passed on the push to main
  # that merging it produces. Requires every job to have actually run and
  # passed: a skipped acceptance job (fork PR) records nothing.
  passed:
    name: Record Passing Tree
    needs: [build, test, vet, fmt, lint, docs, plan, acceptance]
    if: >-
      ${{ !cancelled()
      && github.event_name == 'pull_request'
      && needs.build.result == 'success'
      && needs.test.result == 'success'
      && needs.vet.result == 'success'
      && needs.fmt.result == 'success'
      && needs.lint.result == 'success'
      && needs.docs.result == 'success'
      && needs.plan.result == 'success'
      && needs.acceptance.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The PR run tested the merge of the PR into main, which is what this
      # checks out, so its tree is the one a rebase merge puts on main.
      - uses: actions/checkout@v7

      - name: Write marker
        run: |
          echo "TREE=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
          printf 'run %s\ncommit %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > ci-passed.txt

      - uses: actions/upload-artifact@v7
        with:
          name: ci-passed-tree-${{ env.TREE }}
          path: ci-passed.txt
          retention-days: 14

  # Saves the Go build cache the other jobs restore. It runs on every push to
  # main, even one that skips the rest, so PRs start from a cache of current
  # main; caches saved on PR branches are not visible to other PRs.
  go-cache:
    name: Save Go Build Cache
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: false

      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-build-${{ runner.os }}-

      # What Build, Vet, Unit Tests, Plan Tests and Acceptance Tests compile;
      # -run '^$' compiles every test package without running a test.
      - name: Compile
        run: |
          go build ./...
          go vet ./...
          go test ./... -count=1 -run '^$'

      - uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
